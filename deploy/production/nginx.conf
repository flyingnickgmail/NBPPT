limit_req_zone $binary_remote_addr zone=nbppt_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=nbppt_login:10m rate=1r/s;
server {
    listen 80;
    server_name 38.97.249.8;
    location /.well-known/acme-challenge/ { root /var/www/nbppt-acme; }
    location / { return 308 https://38.97.249.8$request_uri; }
}
server {
    listen 443 ssl;
    server_name 38.97.249.8;
    ssl_certificate /etc/letsencrypt/live/38.97.249.8/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/38.97.249.8/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Keep credentials out of access logs, including accidental query strings.
    access_log off;
    location /api/session {
        limit_req zone=nbppt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Structured reports can contain an inline share PNG (up to 8 MB base64).
    # Keep the 1 MB default for PPT, video, login and all other routes.
    location /api/reports/ {
        client_max_body_size 10m;
        limit_req zone=nbppt_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location / {
        limit_req zone=nbppt_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
