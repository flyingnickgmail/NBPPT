<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵动报告实验室</title><link rel="stylesheet" href="/static/report.css"><link rel="stylesheet" href="/static/studio.css"></head><body>
<header class="studio-top"><a class="studio-brand" href="/">灵动<span>报告实验室</span></a><span class="local-badge">本机运行 · 原型版</span><a href="/static/guide.html" target="_blank">原理与使用 ↗</a></header>
<div class="workspace"><aside class="editor"><div class="editor-intro"><p class="eyebrow">内容 → 叙事 → 交互</p><h1>把好内容，<br>变成值得阅读的报告。</h1><p>贴入材料，选择表达方式。图表、章节与证据，组成一份可以带走的网页。</p><p><a href="/static/design-atlas.html" target="_blank" style="color:#B45F36">查看图形词典与选图示例 ↗</a></p></div>
<form id="form"><label for="title">报告标题 <span>留空则自动拟定</span></label><input id="title" maxlength="180" placeholder="例如：2027 年渠道数字化规划">
<div class="label-row"><label for="content">输入材料</label><label class="file-label" for="file">导入文本 ↗</label><input hidden type="file" id="file" accept=".txt,.md,.json"></div><textarea id="content" maxlength="60000" placeholder="粘贴正文、数据或 Markdown(带标题和列表的文本)。&#10;&#10;建议附上：&#10;• 要讲清的问题与目标读者&#10;• 带单位、时间的数据&#10;• 来源链接与待确认信息" required></textarea><div class="input-meta"><span id="count">0 / 60,000 字</span><button id="sample" type="button">载入演示材料</button></div>
<label for="mode">生成方式</label><select id="mode"><option value="ai">智能编排 · 调用本机已登录的 Codex</option><option value="local">本地排版 · 保留原文，不调用模型</option></select><p class="field-note" id="mode-note">模型整理章节、观点和可比数据。材料会发往 Codex 配置的模型服务，使用现有账户额度。</p>
<label for="theme">阅读风格</label><select id="theme"><option value="paper">暖纸白 · 铜橙强调</option><option value="night">石墨黑 · 沉浸阅读</option></select>
<button class="generate" id="generate" type="submit">生成交互报告 <span>↗</span></button><p id="status" role="status" aria-live="polite">可以先载入演示，查看完整效果。</p><details id="review" hidden><summary id="review-summary">本次质量检查</summary><ul id="review-items"></ul><p class="field-note">结构、数值、引句及表达覆盖检查不代替外部事实核验和内容审核。</p></details></form><p class="editor-foot">全景图任务会在本机保存输入、设计与生成结果，使用已登录模型的账户额度。报告仍需核阅。</p></aside>
<main class="preview-area"><div class="preview-toolbar"><div><span class="preview-dot"></span><strong>报告预览</strong><span id="preview-label">演示材料 · 虚构数据</span></div><div class="preview-controls"><button id="desktop" class="selected" title="桌面预览">桌面</button><button id="mobile" title="手机预览">手机</button><button id="full">打开报告 ↗</button><button id="download" class="download">下载网页 ↓</button><button id="json">保存内容</button><button id="resume-report" hidden>继续复审与编排</button><button id="overview-generate">一键生成全景图</button></div></div><div class="frame-wrap"><iframe id="preview" title="交互报告预览" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe></div></main></div>
<script src="/static/overview_generate.js"></script><script src="/static/studio.js"></script></body></html>
