<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告尺寸预览</title><style>body{margin:0;background:#e9eef5;font:13px -apple-system,sans-serif;color:#132333}nav{display:flex;gap:8px;padding:12px;align-items:center;flex-wrap:wrap}button,a{cursor:pointer;border:1px solid #cbd5e2;padding:8px 12px;background:#fff;color:#132333;text-decoration:none;border-radius:4px;font:inherit}button[aria-pressed=true]{background:#2251ff;color:#fff}main{padding:0 12px 12px;overflow:auto;height:calc(100vh - 70px);box-sizing:border-box}iframe{height:100%;border:1px solid #cbd5e2;background:#fff;display:block}p{padding:20px}</style><nav><span>报告尺寸预览</span><button data-width="375">手机 375</button><button data-width="768">平板 768</button><button data-width="1024">桌面 1024</button><button data-width="1440">宽屏 1440</button><a id="full">打开完整报告 ↗</a></nav><main><iframe id="frame" title="指定报告的尺寸预览"></iframe></main><script>
const params=new URLSearchParams(location.search),id=params.get('report'),frame=document.getElementById('frame');
if(/^[a-f0-9]{32}$/.test(id||'')){frame.src='/preview/'+id;document.getElementById('full').href=frame.src;function size(width){frame.style.width=width+'px';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.width)===width)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>size(Number(b.dataset.width)));size([375,768,1024,1440].includes(Number(params.get('width')))?Number(params.get('width')):375);}else document.querySelector('main').textContent='请从有效报告链接打开尺寸预览。';
</script></html>
