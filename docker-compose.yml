version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_billing
    volumes:
      - ./sql/init_postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  overseas-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pa-overseas-worker
    command: uvicorn worker.worker_api:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
    expose:
      - "8001"
    restart: unless-stopped

  domestic-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pa-domestic-gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      OVERSEAS_WORKER_URL: http://overseas-worker:8001
    volumes:
      - ./workspace:/app/workspace
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - overseas-worker
      - postgres
    restart: unless-stopped

volumes:
  pg_data:
