name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python, JavaScript and deployment chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.quality-output/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx ffmpeg fonts-noto-cjk fontconfig acl apparmor
          python -m pip install -r requirements-dev.txt -r requirements-microsoft-voice.txt
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
          # Ubuntu restricts user namespaces for downloaded browsers. Allow
          # only this exact ephemeral browser path, preserving both Chromium's
          # sandbox and the host-wide AppArmor restriction.
          NBPPT_CI_CHROMIUM="$(node -e "process.stdout.write(require('./tests/browser/node_modules/playwright').chromium.executablePath())")"
          sudo tee /etc/apparmor.d/nbppt-ci-chromium >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile nbppt-ci-chromium "$NBPPT_CI_CHROMIUM" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/nbppt-ci-chromium
      - name: Run all existing checks and the TLS proxy acceptance
        env:
          NBPPT_TEST_ROOT: ${{ runner.temp }}/nbppt-checks
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          # Video subprocess limits count every thread for a Linux UID. The
          # runner account also owns Actions services; use a dedicated test UID
          # just as production uses a separate non-root execution account.
          sudo useradd --system --create-home --user-group nbppt-ci
          sudo chown -R nbppt-ci:nbppt-ci "$GITHUB_WORKSPACE"
          sudo install -d -o nbppt-ci -g nbppt-ci "$NBPPT_TEST_ROOT"
          # Hosted runner ancestors are private. Grant only traversal to the
          # two exact working paths, without opening the runner home for listing.
          for NBPPT_CI_PATH in "$GITHUB_WORKSPACE" "$NBPPT_TEST_ROOT"; do
            NBPPT_CI_PARENT="$(dirname "$NBPPT_CI_PATH")"
            while [ "$NBPPT_CI_PARENT" != / ]; do
              sudo setfacl -m u:nbppt-ci:--x "$NBPPT_CI_PARENT"
              NBPPT_CI_PARENT="$(dirname "$NBPPT_CI_PARENT")"
            done
          done
          sudo -u nbppt-ci env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" NBPPT_TEST_ROOT="$NBPPT_TEST_ROOT" PYTHONDONTWRITEBYTECODE=1 bash tools/check.sh --deployment
      - name: Stage selected acceptance receipts for the runner
        if: always()
        env:
          NBPPT_TEST_ROOT: ${{ runner.temp }}/nbppt-checks
        run: |
          # pytest intentionally creates private directories. Do not broaden
          # their permissions or have the uploader recursively inspect them.
          sudo -u nbppt-ci env NBPPT_TEST_ROOT="$NBPPT_TEST_ROOT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python -B - <<'PY'
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ['NBPPT_TEST_ROOT'])
          dest = Path(os.environ['GITHUB_WORKSPACE']) / '.quality-output' / 'receipts'
          dest.mkdir(parents=True, exist_ok=True)
          for pattern in ('run-*/gate.json', 'run-*/pytest.xml', 'run-*/*.log',
                          'run-*/workbench/receipt.json', 'run-*/workbench/workbench.png'):
              for source in root.glob(pattern):
                  target = dest / source.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  target.chmod(0o644)
                  if source.name == 'backend.log':
                      print(source.read_text()[-24000:])
          PY
      - name: Preserve the exact gate and product receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-acceptance-evidence
          path: ${{ github.workspace }}/.quality-output/receipts/
          if-no-files-found: warn
          retention-days: 14
