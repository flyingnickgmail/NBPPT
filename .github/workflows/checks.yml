name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python, JavaScript and deployment chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx ffmpeg fonts-noto-cjk fontconfig
          python -m pip install -r requirements-dev.txt
      - name: Run all existing checks and the TLS proxy acceptance
        env:
          NBPPT_TEST_ROOT: ${{ runner.temp }}/nbppt-checks
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash tools/check.sh --deployment
