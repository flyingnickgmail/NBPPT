name: Product quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-product-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.quality-output/browsers
      TMPDIR: ${{ github.workspace }}/.quality-output/tmp
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Prepare isolated runtime
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-dev.txt -r requirements-microsoft-voice.txt
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the same gate as local development
        run: python -B tools/quality_gate.py --output "$GITHUB_WORKSPACE/.quality-output/runs"
      - name: Preserve test and product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-quality-evidence
          path: |
            .quality-output/runs/**/gate.json
            .quality-output/runs/**/pytest.xml
            .quality-output/runs/**/*.log
            .quality-output/runs/**/workbench/receipt.json
            .quality-output/runs/**/workbench/workbench.png
          if-no-files-found: warn
          retention-days: 14
